<script>

const spreadsheetID = "2PACX-1vRQyritzRlF6_UArDQXg-1DlYpBu2D_Py0LFfgw7d4SNG7VlX2ZSA9ry8w1NXw5tAy7wyWw3lPVjDVx";

// DAFTAR GID TAB
const gids = [
  "0",
  "123456789",
  "987654321"
];

// AUTO BUAT LINK CSV
const sheetURLs = gids.map(
  gid =>
    `https://docs.google.com/spreadsheets/d/e/${spreadsheetID}/pub?gid=${gid}&single=true&output=csv`
);

async function cek() {

  let id = document.getElementById("idInput").value.trim();

  let found = false;

  for (const url of sheetURLs) {

    let res = await fetch(url);
    let text = await res.text();

    let rows = text.split("\n");

    for (let i = 1; i < rows.length; i++) {

      let col = rows[i].split(",");

      if (col[0] === id) {

        let html = `
          <span class="valid">✅ VALID</span><br><br>
        `;

        // TAMPILKAN SEMUA KOLOM OTOMATIS
        const headers = rows[0].split(",");

        headers.forEach((header, index) => {

          let value = col[index];

          if (!value) return;

          // FORMAT RUPIAH
          if (
            header.toLowerCase().includes("reward")
          ) {
            value = "Rp" + Number(value).toLocaleString("id-ID");
          }

          html += `<b>${header}:</b> ${value}<br>`;
        });

        document.getElementById("hasil").innerHTML = html;

        found = true;
        break;
      }
    }

    if (found) break;
  }

  if (!found) {
    document.getElementById("hasil").innerHTML =
      `<span class="invalid">❌ TIDAK TERDAFTAR</span>`;
  }
}

// AUTO DETECT DARI QR

const params = new URLSearchParams(window.location.search);
const idURL = params.get("id");

if (idURL) {
  document.getElementById("idInput").value = idURL;
  cek();
}

</script>
